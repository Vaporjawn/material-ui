name: Add closing message to issue

on:
  issues:
    types:
      - closed

permissions: {}

jobs:
  add-comment:
    name: Add closing message
    if: github.event.issue.state_reason == 'completed'
    uses: mui/mui-public/.github/workflows/issues_add-closing-message.yml@e44688894ae822e6f958f1b7f0ce29cab20210a8 # master
    permissions:
      contents: read
      issues: write
